<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        /* Basic Styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #chat-container {
            width: 90%;
            max-width: 600px;
            height: 80vh;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
        }
        #chat-window {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* Message Bubbles */
        .message {
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.4;
            max-width: 75%;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        .bot-message {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        /* Input Area */
        #input-area {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 15px;
        }
        #message-input {
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 12px 18px;
            font-size: 1em;
            outline: none;
        }
        #send-button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 1.5em;
            margin-left: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #send-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <header>Pluto</header>
        <div id="chat-window" role="log">
            <div class="message bot-message">
                Hello! I'm Pluto.
            </div>
        </div>
        <form id="input-area">
            <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" aria-label="Chat message">
            <button id="send-button" type="submit" aria-label="Send message">&#10148;</button>
        </form>
    </div>

    <script>
        // Get elements from the DOM
        const chatWindow = document.getElementById('chat-window');
        const messageForm = document.getElementById('input-area');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        // Function to add a message to the chat window
        function addMessage(sender, text) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            
            if (sender === 'user') {
                messageElement.classList.add('user-message');
            } else {
                messageElement.classList.add('bot-message');
            }
            
            messageElement.textContent = text;
            chatWindow.appendChild(messageElement);
            
            // Scroll to the bottom
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Handle form submission
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page reload
            
            const messageText = messageInput.value.trim();
            if (messageText === '') return; // Don't send empty messages

            // 1. Display user's message
            addMessage('user', messageText);
            messageInput.value = ''; // Clear input

            // 2. Send message to the backend (Flask server)
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: messageText }),
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                
                // 3. Display bot's response
                addMessage('bot', data.response);

            } catch (error) {
                console.error('Error:', error);
                addMessage('bot', 'Sorry, I ran into an error. Please try again.');
            }
        });
    </script>
</body>
</html>
